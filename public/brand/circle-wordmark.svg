<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 64" fill="none" role="img" aria-label="Circle">
  <!--
    Tight viewBox around ink. Mark + word share one vertical center (y=32)
    via dominant-baseline=central so the C-ring and IRCLE optically align.
    Right padding is intentional (~8px) so the final E doesn't feel clipped.
  -->
  <circle cx="30" cy="32" r="22" stroke="#00B84D" stroke-width="6.5" fill="none"/>
  <text
    x="30"
    y="32"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="var(--font-outfit), Outfit, Arial Black, Helvetica Neue, Arial, sans-serif"
    font-size="30"
    font-weight="800"
    fill="#00B84D"
  >C</text>
  <circle cx="49" cy="32" r="7" fill="#00B84D"/>
  <text
    x="64"
    y="31"
    dominant-baseline="central"
    font-family="var(--font-outfit), Outfit, Arial Black, Helvetica Neue, Arial, sans-serif"
    font-size="32"
    font-weight="800"
    letter-spacing="1.5"
    fill="#00B84D"
  >IRCLE</text>
</svg>
